name: ASCENDRA Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Dependencies
      run: |
        npm ci
        cd backend && npm ci

    - name: Run ESLint Verification
      run: npm run lint

    - name: Run Backend Automated Test Suite
      run: |
        cd backend && npm test

    - name: Build Production Bundle
      run: npm run build
