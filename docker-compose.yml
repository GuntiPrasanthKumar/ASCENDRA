version: '3.8'

services:
  ascendra-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/ascendra_db
      - REDIS_URI=redis://redis:6379
      - JWT_SECRET=production_enterprise_jwt_secret_key_8892
    depends_on:
      - mongo
      - redis
    restart: always

  mongo:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    restart: always

volumes:
  mongo_data:
